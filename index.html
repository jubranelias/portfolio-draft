    <title>Jubran Elias, Product Designer</title>
    <script>
      // Apply the saved light/dark choice before the page paints
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
      // Intro preloader: plays once per visit (per browser tab session). Visitors who prefer
      // reduced motion get a calm version (the finished logo fading in and out).
      var introPlayed = false;
      try { introPlayed = sessionStorage.getItem('intro-played') === '1'; } catch (e) {}
      if (!introPlayed) {
        document.documentElement.classList.add('is-preloading');
        // Keep DEFAULT_INTRO in step with site.preloader.variant in src/config/site.ts
        var DEFAULT_INTRO = '2';
        if (DEFAULT_INTRO === '2') document.documentElement.classList.add('is-preloading-v2');
      }
      try {
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.classList.add('is-preloading-calm');
      } catch (e) {}
    </script>
    <style>
      /* Solid cover until the preloader itself mounts, so the page never flashes */
      html.is-preloading body::before {
        content: '';
        position: fixed;
        inset: 0;
        z-index: 999;
        background: #000000; /* the preloader's black wall */
      }
      html.is-preloading-v2 body::before {
        background: #fdfdfd; /* intro 2's film background */
      }
      html.is-preloading-calm body::before {
        background: #fafaf8;
      }
    </style>
